name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · unit tests · realtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (strict, whole workspace)
        run: pnpm -r typecheck

      - name: Unit tests
        run: |
          pnpm --filter @kith/domain test
          pnpm --filter @kith/paystack test
          pnpm --filter @kith/web test

      # The auction engine is exercised over a real socket, not mocks: boot the service,
      # run the smoke harness (join → bid → soft-close → reject-then-accept), then kill it.
      - name: Realtime auction smoke
        run: |
          pnpm --filter @kith/realtime dev &
          SERVER=$!
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3001/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node apps/realtime/test/smoke.mjs
          kill $SERVER

  db:
    name: Migrations + seed against embedded Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # PGlite stands in for Postgres in CI exactly as it does locally: real SQL, real
      # DDL, real constraints — no DATABASE_URL required.
      - name: Seed (idempotent — runs migrations, then demo data)
        run: |
          mkdir -p .cache
          pnpm --filter @kith/database db:seed
      - name: Re-run seed to prove idempotency
        run: pnpm --filter @kith/database db:seed

  smoke:
    name: Boot both services and pass HTTP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Local env
        run: |
          {
            echo "AUTH_SECRET=ci-secret-not-used-in-production"
            echo "AUTH_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SOCKET_URL=http://localhost:3001"
          } > apps/web/.env.local

      - name: Migrate + seed (embedded PGlite)
        run: |
          mkdir -p .cache
          pnpm --filter @kith/database db:seed

      - name: Boot realtime + web
        run: |
          pnpm --filter @kith/realtime dev > /tmp/realtime.log 2>&1 &
          pnpm --filter @kith/web dev > /tmp/web.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:3000/login > /dev/null && curl -fsS http://localhost:3001/healthz > /dev/null; then
              echo "both services up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "services did not come up"; tail -40 /tmp/web.log /tmp/realtime.log; exit 1

      - name: Smoke — public surfaces + authenticated consoles
        run: SMOKE_EMAIL=student@demo.kith.ng SMOKE_PASSWORD=demo1234 node scripts/smoke.mjs --auth
